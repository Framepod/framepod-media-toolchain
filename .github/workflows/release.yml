name: ffmpeg release

# GitHub cannot trigger on another repository's releases, so poll FFmpeg's tags instead.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "FFmpeg tag to build, e.g. n8.1.2. Defaults to the newest one."
        required: false

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      line: ${{ steps.pick.outputs.line }}
      needed: ${{ steps.pick.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED"
          if [[ -z "$tag" ]]; then
            tag=$(git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg.git \
                  | grep -oE 'n[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
          fi
          line=${tag#n}; line=${line%.*}

          # The addin decides FFVER, which decides the dependency set baked into the image.
          # A line without one would silently build against master's, so stop instead.
          if [[ ! -f "ffmpeg/win-linux/addins/${line}.sh" ]]; then
            echo "::error::no addin for FFmpeg line ${line}; add ffmpeg/win-linux/addins/${line}.sh" >&2
            exit 1
          fi

          needed=true
          gh release view "$tag" >/dev/null 2>&1 && needed=false

          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "line=$line"     >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "$tag (line $line), build needed: $needed" >> "$GITHUB_STEP_SUMMARY"

  win-linux:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [win64, winarm64, linux64, linuxarm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: dependency image
        working-directory: ffmpeg/win-linux
        env:
          QUICKBUILD: 1
          PUSH: 1
          NOCLEAN: 1
          LINE: ${{ needs.check.outputs.line }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}/${{ matrix.target }}-gpl-${LINE}:latest"
          # Patch releases on the same line reuse it; only a new line pays for a build.
          docker pull "$image" || ./makeimage.sh ${{ matrix.target }} gpl "$LINE"

      - name: build ffmpeg
        working-directory: ffmpeg/win-linux
        env:
          GIT_BRANCH_OVERRIDE: ${{ needs.check.outputs.tag }}
        run: ./build.sh ${{ matrix.target }} gpl ${{ needs.check.outputs.line }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ffmpeg/win-linux/artifacts/*
          if-no-files-found: error

  macos:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: host toolchain
        run: brew install cmake meson ninja nasm pkg-config autoconf automake libtool svn
      - name: build ffmpeg
        working-directory: ffmpeg/macos
        env:
          GIT_BRANCH: ${{ needs.check.outputs.tag }}
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ffmpeg/macos/artifacts/*
          if-no-files-found: error

  release:
    needs: [check, win-linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          # The .txt files build.sh drops for Actions are bookkeeping, not deliverables.
          find dist -name '*.txt' ! -name 'LICENSE.txt' -delete
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg $TAG" \
            --notes "Self-contained GPLv3 builds of FFmpeg $TAG for win64, winarm64, linux64, linuxarm64 and macos-arm64."
